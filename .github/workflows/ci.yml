name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: API types match docs/openapi.json
        run: npm run api:check

      - name: Message catalogues are up to date
        run: npm run i18n:check

      - name: Unit and component tests (runner in America/New_York)
        run: npm test

      - name: Date tests again, runner in Asia/Manila
        run: npx vitest run src/lib src/test
        env:
          TEST_TZ: Asia/Manila

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

  e2e:
    # Real-API end-to-end tests (plan.md §8, backend dependency D-14). The job needs read access
    # to the backend repository: set the repository variable E2E_BACKEND_REPOSITORY (for example
    # `<owner>/doc-tayo-api`) and the secret E2E_BACKEND_TOKEN. Until then it is skipped, and the
    # real-API run is local only (see README).
    if: ${{ vars.E2E_BACKEND_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway credentials: the database lives and dies with this job.
      BACKEND_DIR: backend
      DATABASE_URL: postgresql://doctayo_app:ci-app-password@localhost:5432/doc_tayo_test
      DATABASE_MIGRATION_URL: postgresql://doctayo_owner:ci-owner-password@localhost:5432/doc_tayo_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.E2E_BACKEND_REPOSITORY }}
          token: ${{ secrets.E2E_BACKEND_TOKEN }}
          path: backend

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies and build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Create roles, databases and grants
        working-directory: backend
        run: >
          psql -v ON_ERROR_STOP=1
          -v owner_password=ci-owner-password
          -v app_password=ci-app-password
          -f scripts/db/bootstrap.sql
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-superuser-password
          PGDATABASE: postgres

      - name: Apply backend migrations
        working-directory: backend
        run: npm run db:migrate:deploy

      - name: Start the API (cookies on, preview origin allowed)
        working-directory: backend
        run: |
          nohup node dist/main > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat ../api.log
          exit 1
        env:
          NODE_ENV: test
          PORT: '3000'
          DATABASE_SCHEMA: public
          DATABASE_SSL: disable
          # The backend's own CI uses CORS_ALLOW_CREDENTIALS=false; the refresh cookie needs true.
          CORS_ALLOWED_ORIGINS: http://localhost:4173
          CORS_ALLOW_CREDENTIALS: 'true'
          LOG_LEVEL: error
          LOG_FORMAT: json
          OBSERVE_ENABLED: 'false'
          JWT_ACCESS_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnop
          ARGON2_MEMORY_KIB: '1024'
          ARGON2_TIME_COST: '1'
          OUTBOX_RELAY: 'off'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium, WebKit, Firefox, mobile viewport)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    # Informational for now (same as the backend); make blocking once the baseline is understood.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
